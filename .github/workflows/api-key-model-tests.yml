name: api-key-model-tests
# Tests LLM mode with an explicitly pinned model (no chain probe needed).
# Both GEMINI_API_KEY and GEMINI_MODEL are set.
#
# Required repository secret:  secrets.GEMINI_API_KEY
# Required repository variable: vars.GEMINI_MODEL

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  api-key-model-tests:
    name: api-key-model-tests
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
    steps:
      - name: Validate environment
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::secrets.GEMINI_API_KEY is not set. Add it as a repository secret." >&2
            exit 1
          fi
          if [ -z "$GEMINI_MODEL" ]; then
            echo "::error::vars.GEMINI_MODEL is not set. Add it as a repository variable." >&2
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: make install

      - name: Run tests
        run: make test
