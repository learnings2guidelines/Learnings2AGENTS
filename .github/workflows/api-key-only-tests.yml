name: api-key-only-tests
# Tests LLM mode with auto-detected model (the chain probe in GeminiClient).
# Only GEMINI_API_KEY is set; GEMINI_MODEL is intentionally left empty.
#
# Required repository secret:  secrets.GEMINI_API_KEY

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  api-key-only-tests:
    name: api-key-only-tests
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Intentionally empty: model should be auto-detected without this value.
      GEMINI_MODEL: ""

    steps:
      - name: Validate environment
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::secrets.GEMINI_API_KEY is not set. Add it as a repository secret." >&2
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: make install

      - name: Run tests
        run: make test
